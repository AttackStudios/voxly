# Render — Voxly as a free web service. Data lives in Upstash Redis (keys
# prefixed `voxly:`), so the free tier's wiped disk doesn't lose anything.
services:
  - type: web
    name: voxly
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD   # server never needs the Electron binary
        value: "1"
      - key: JWT_SECRET                       # keeps everyone logged in across restarts
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL           # Upstash → database → REST API
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: OWNER_EMAIL                      # this email gets the owner rank on sign-up
        sync: false
      # Optional: TURN_URLS / TURN_USERNAME / TURN_CREDENTIAL for strict networks,
      # INVITE_CODE to require a code at sign-up, SIGNUP=off to close sign-up.
